<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A101C"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Courtside Edge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column of frosted-glass panels floating over a dark arena glow, thumb-reach tab bar at the bottom, bottom sheets for detail. */
:root{
  --bg:#0A101C; --bg-2:#111a2c; --ink:#EAF0FA; --muted:#93A1B9; --dim:#5D6A82;
  --glass:rgba(160,185,230,.06); --glass-2:rgba(160,185,230,.11); --stroke:rgba(200,215,245,.13); --stroke-2:rgba(200,215,245,.26);
  --amber:#F2A541; --teal:#56C7D6; --good:#3DDC97; --bad:#FF7272; --warn:#FFD166;
  --f-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100%;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
  radial-gradient(60vmax 45vmax at 5% -10%,rgba(242,165,65,.20),transparent 62%),
  radial-gradient(55vmax 50vmax at 105% 105%,rgba(86,199,214,.17),transparent 62%),
  radial-gradient(35vmax 30vmax at 85% 15%,rgba(130,100,255,.09),transparent 60%),var(--bg)}
.bg svg{position:absolute;left:50%;top:50%;width:min(130vmax,1500px);transform:translate(-50%,-50%);opacity:.055}

.app{max-width:1080px;margin:0 auto}
.glass{background:linear-gradient(180deg,var(--glass-2),var(--glass));border:1px solid var(--stroke);border-radius:var(--r);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07)}
.react{background-image:radial-gradient(260px circle at var(--mx,50%) var(--my,-60%),rgba(255,255,255,.09),transparent 65%),linear-gradient(180deg,var(--glass-2),var(--glass))}
.tap{position:relative;overflow:hidden;transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .2s,background-color .2s;touch-action:manipulation}
.tap:active{transform:scale(.975)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.22);transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand span{color:var(--amber)}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.hdr-r{display:flex;align-items:center;gap:8px}
.bank{display:flex;flex-direction:column;align-items:flex-end;padding:6px 12px;border-radius:12px;background:rgba(242,165,65,.12);border:1px solid rgba(242,165,65,.3)}
.bank span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bank b{font-family:var(--f-mono);font-size:16px;color:var(--amber)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--glass)}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);color:#FBE7B3}
.banner.info{background:rgba(86,199,214,.08);border:1px solid rgba(86,199,214,.3);color:#CDEFF4}
.banner b{color:var(--ink)}

.view{display:flex;flex-direction:column;gap:16px;margin-top:18px;animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel{padding:16px}
.panel>.lbl{margin-bottom:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-4px;padding-inline:4px}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);font-size:13.5px;font-weight:600;white-space:nowrap;min-height:40px}
.chip.on{background:rgba(242,165,65,.16);border-color:rgba(242,165,65,.55);color:var(--amber)}

/* best bets */
.best{padding:16px;display:flex;flex-direction:column;gap:12px}
.best-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.best-h h3{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.bb{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);text-align:left;width:100%}
.bb .t{font-weight:700}
.bb .s{font-size:12.5px;color:var(--muted)}
.bb .stk{text-align:right}
.bb .stk b{display:block;font-family:var(--f-mono);font-size:17px;color:var(--good)}
.bb .stk span{font-size:11px;color:var(--muted)}
.bb.capped{opacity:.55}
.empty{padding:14px;border-radius:14px;border:1px dashed var(--stroke-2);color:var(--muted);font-size:13.5px}

/* game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.live{color:var(--bad);font-weight:700}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tm-n{min-width:0}
.tm-n b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-n span{font-size:12px;color:var(--muted)}
.tm-p{font-family:var(--f-mono);font-size:20px;font-weight:700}
.tb{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 55%,#0b1222);border:1px solid rgba(255,255,255,.14);flex:none;overflow:hidden}
.tb b{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.02em}
.tb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#0F1729}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.b2b{background:rgba(255,209,102,.14);color:var(--warn)}
.tag.inj{background:rgba(255,114,114,.14);color:#FFB0B0}
.winbar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.winbar i{display:block;height:100%}
.angle{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.angle-t{flex:1;min-width:0;font-size:13.5px}
.angle-t b{display:block}
.angle-t span{color:var(--muted);font-size:12px}

.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.v-bet{background:rgba(61,220,151,.16);color:var(--good);border:1px solid rgba(61,220,151,.4)}
.v-lean{background:rgba(242,165,65,.14);color:var(--amber);border:1px solid rgba(242,165,65,.35)}
.v-pass{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--stroke)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ring{width:40px;height:40px;flex:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(3,6,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:absolute;left:50%;bottom:0;width:min(780px,100%);max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-50%);
  border-radius:26px 26px 0 0;background:linear-gradient(180deg,rgba(28,38,60,.86),rgba(14,20,34,.92));border-bottom:0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .34s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translate(-50%,100%)}}
.grab{position:sticky;top:0;z-index:2;padding:10px 0 8px;display:flex;justify-content:center;cursor:grab;touch-action:none;background:linear-gradient(180deg,rgba(26,36,58,.97),rgba(26,36,58,0))}
.grab i{width:44px;height:5px;border-radius:9px;background:var(--stroke-2)}
.sh{display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h3{font-family:var(--f-display);font-size:28px;font-weight:800;text-transform:uppercase;line-height:1.05}
.proj{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.proj .side{display:flex;flex-direction:column;gap:2px}
.proj .side:last-child{align-items:flex-end;text-align:right}
.proj .sc{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.proj .mid{text-align:center;font-size:12px;color:var(--muted)}
.factors{display:flex;flex-direction:column}
.fac{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--stroke)}
.fac:last-child{border-bottom:0}
.fac b{font-weight:600}
.fac .v{font-family:var(--f-mono);font-weight:700;text-align:right}
.fac .n{grid-column:1/-1;font-size:12px;color:var(--muted)}
.inj-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--stroke);font-size:13.5px}
.inj-row:last-child{border-bottom:0}
.inj-row .nm{flex:1;min-width:0}
.inj-row .nm span{display:block;font-size:11.5px;color:var(--muted)}
.inj-row input{width:20px;height:20px;accent-color:var(--amber)}
.st{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.st-out{background:rgba(255,114,114,.16);color:#FFB0B0}.st-q{background:rgba(255,209,102,.14);color:var(--warn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.sub{padding:14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--stroke)}
.sub>.lbl{margin-bottom:6px}

.sel{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr)) auto;gap:8px 12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--stroke)}
.sel.bet{border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.06)}
.sel-name{font-weight:700}
.sel-sub{font-size:11.5px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:15px}
.kv input{width:100%;min-width:0}
.sel-act{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.why{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .sel{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sel .sel-main{grid-column:1/-1}
  .sel .sel-act{grid-column:1/-1;justify-content:space-between}
}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:10px;padding:8px 10px;min-height:40px;font-family:var(--f-mono);font-size:15px;width:100%}
.inp:focus{border-color:var(--amber);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13.5px;border:1px solid var(--stroke-2);background:rgba(255,255,255,.07)}
.btn.pri{background:var(--amber);color:#1B1206;border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:rgba(255,114,114,.4)}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}

/* props */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px;margin-top:10px;max-height:320px;overflow-y:auto}
.pl{padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);text-align:left;font-weight:600;font-size:13.5px}
.pl span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.pl.on{border-color:rgba(242,165,65,.6);background:rgba(242,165,65,.12)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;padding-top:8px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:rgba(255,114,114,.55)}
.bar.o i{background:rgba(61,220,151,.7)}
.bar b{font-family:var(--f-mono);font-size:11px}
.bar span{font-size:9.5px;color:var(--muted);white-space:nowrap}
.line-mk{position:absolute;left:0;right:0;border-top:2px dashed var(--amber);pointer-events:none}
.line-mk em{position:absolute;right:0;top:-18px;font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--amber);background:var(--bg-2);padding:0 4px;border-radius:4px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}.grid3 .field:first-child{grid-column:1/-1}}
.tile{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.tile span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-family:var(--f-mono);font-size:20px;margin-top:2px}
.tile small{font-size:11.5px;color:var(--muted)}

/* tracker */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--stroke)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--stroke);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.bet-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--stroke)}
.bet-row:last-child{border-bottom:0}
.bet-row .meta{font-size:12px;color:var(--muted)}
.bet-row .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.res{font-family:var(--f-mono);font-weight:700;text-align:right}
.spark{width:100%;height:80px;display:block}

/* settings */
.set-group{padding:16px;display:flex;flex-direction:column;gap:16px}
.set-group h3{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.srow{display:flex;flex-direction:column;gap:6px}
.srow-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.srow-h label{font-weight:600}
.srow-h output{font-family:var(--f-mono);font-weight:700;color:var(--amber)}
.srow p{font-size:12.5px;color:var(--muted)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.12);transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:.2s}
.switch input:checked+i{background:var(--amber)}
.switch input:checked+i::after{transform:translateX(22px);background:#1B1206}
.switch input:focus-visible+i{outline:2px solid var(--amber);outline-offset:2px}
.prose{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;max-width:68ch}
.prose b{color:var(--ink)}
textarea.inp{min-height:90px;font-size:12px;resize:vertical}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:22px;width:100%;max-width:480px;background:linear-gradient(180deg,rgba(30,42,66,.78),rgba(16,24,40,.82))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;font-size:11px;font-weight:700;color:var(--muted);min-height:52px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--amber);background:rgba(242,165,65,.13)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 16px;border-radius:14px;background:rgba(20,28,46,.92);border:1px solid var(--stroke-2);font-weight:600;font-size:13.5px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{height:190px;border-radius:var(--r);background:linear-gradient(90deg,var(--glass) 0%,var(--glass-2) 50%,var(--glass) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border:1px solid var(--stroke)}
@keyframes sh{to{background-position:-200% 0}}
a{color:var(--teal)}
/* best bets v2 */
.bb-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bb-sum div{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);min-width:0}
.bb-sum span,.bs span{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-sum b{font-family:var(--f-mono);font-size:16px}

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const pct = (x,d=0) => (x*100).toFixed(d) + '%';
const sgn = (x,d=1) => (x>=0?'+':'−') + Math.abs(x).toFixed(d);
const peso = n => '₱' + Math.round(n).toLocaleString('en-US');
const store = {
  get(k,d){ try{ const v = localStorage.getItem('ce_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('ce_'+k, JSON.stringify(v)); }catch(e){} }
};
function Phi(x){ const t=1/(1+0.2316419*Math.abs(x)); const d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x>0?1-p:p; }
let SD_M = 12.5, SD_T = 18;   // typical NBA spread of results around expectation (margin, total)
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }
function etYMD(off){ const d=new Date((SNAP?SNAP.t:Date.now())+off*864e5);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replace(/-/g,''); }
// Snapshot mode: the published preview can't reach ESPN, so live data is baked in as window.__CE_SNAP.
const SNAP=(typeof window!=='undefined' && window.__CE_SNAP && window.__CE_SNAP.data) ? window.__CE_SNAP : null;
let inFlight=0; const waiting=[];
async function fetchJSON(url, ms=12000){
  if(SNAP){ if(url in SNAP.data) return {json:SNAP.data[url], headers:new Headers()}; throw new Error('not in snapshot'); }
  if(inFlight>=5) await new Promise(r=>waiting.push(r));
  inFlight++;
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return {json:await r.json(), headers:r.headers}; }
  finally{ clearTimeout(t); inFlight--; const nx=waiting.shift(); if(nx) nx(); }
}

/* ---------- state ---------- */
const DEF = {startBank:2000,kelly:0.5,maxBet:500,maxPct:5,dailyPct:15,minBet:20,minEdge:2,minConf:50,winMode:true,minWinP:55,trust:40,hca:2,oddsKey:'',book:'1xBet',combos:true,autoTune:true};
const S = {
  set: Object.assign({}, DEF, store.get('set',{})),
  bets: store.get('bets',[]), ov: store.get('ov',{}),
  games:[], standings:{}, injuries:{}, b2b:new Set(), lg:114, oddsApi:[], oddsLeft:null,
  demo:false, dayOffset:0, tab:'slate', impact:{}, logs:{}, rosters:{}, status:{}, loading:false,
  sheetGid:null, sel:{}, lineups:{}, bbSort:'conf', xkey:{}, evid:{}, betSid:null, snap:store.get('snap',{}), tune:null,
  props:{gid:null, team:null, pid:null, pname:'', stat:'pts', line:'', over:'1.87', under:'1.87', q:''}
};
const saveSet = () => store.set('set', S.set);
const saveBets = () => store.set('bets', S.bets);
const saveOv = () => store.set('ov', S.ov);
const ovOf = gid => (S.ov[gid] = S.ov[gid] || {odds:{}, inj:{}, tweak:0});

/* ---------- data: ESPN + The Odds API ---------- */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
function teamFrom(c){ const t=c.team||{}; return {id:String(t.id), abbr:t.abbreviation, name:t.displayName, short:t.shortDisplayName||t.name,
  logo:t.logo, color:t.color?'#'+t.color:'#3a4a66', record:(c.records||[])[0]?.summary||'', score:c.score}; }
const dec = a => { a=+a; if(!a) return null; return a>0 ? 1+a/100 : 1+100/(-a); };
function parseEspnOdds(o, homeAbbr){
  if(!o) return null; const m={}, num=x=>{ const v=parseFloat(String(x??'').replace(/^[ou]/i,'')); return isNaN(v)?null:v; };
  const hML=dec(o.homeTeamOdds?.moneyLine ?? o.moneyline?.home?.close?.odds), aML=dec(o.awayTeamOdds?.moneyLine ?? o.moneyline?.away?.close?.odds);
  if(hML && aML){ m.mlH={odds:hML}; m.mlA={odds:aML}; }
  let sp=num(o.pointSpread?.home?.close?.line);
  if(sp==null){ const det=o.details||'', mm=det.match(/^([A-Z]{2,4})\s+([+-]?\d+(\.\d+)?)/); if(mm){ const v=+mm[2]; sp = mm[1]===homeAbbr ? v : -v; } else if(/even|pk/i.test(det)) sp=0; }
  if(sp!=null){ m.spH={point:sp, odds:dec(o.homeTeamOdds?.spreadOdds)||dec(o.pointSpread?.home?.close?.odds)||1.91}; m.spA={point:-sp, odds:dec(o.awayTeamOdds?.spreadOdds)||dec(o.pointSpread?.away?.close?.odds)||1.91}; }
  const tl=num(o.total?.over?.close?.line) ?? (o.overUnder?+o.overUnder:null);
  if(tl!=null){ m.ov={point:tl, odds:dec(o.overOdds)||dec(o.total?.over?.close?.odds)||1.91}; m.un={point:tl, odds:dec(o.underOdds)||dec(o.total?.under?.close?.odds)||1.91}; }
  // opening prices: where the market started, so the app can see which way it moved
  const op={mlH:dec(o.moneyline?.home?.open?.odds), mlA:dec(o.moneyline?.away?.open?.odds), spH:num(o.pointSpread?.home?.open?.line), tot:num(o.total?.over?.open?.line)};
  if(Object.values(op).some(v=>v!=null)) m.open=op;
  return Object.keys(m).length ? m : null;
}
async function loadScoreboard(ymd){
  const {json} = await fetchJSON(`${ESPN}/scoreboard?dates=${ymd}`);
  return (json.events||[]).map(ev=>{
    const c=ev.competitions?.[0]||{}; const hc=(c.competitors||[]).find(x=>x.homeAway==='home'), ac=(c.competitors||[]).find(x=>x.homeAway==='away');
    if(!hc||!ac) return null;
    const home=teamFrom(hc), away=teamFrom(ac);
    return {id:String(ev.id), date:ev.date, state:ev.status?.type?.state||'pre', statusText:ev.status?.type?.shortDetail||'', home, away,
      espnOdds:parseEspnOdds((c.odds||[])[0], home.abbr)};
  }).filter(Boolean);
}
async function loadStandings(season){
  const {json} = await fetchJSON('https://site.api.espn.com/apis/v2/sports/basketball/nba/standings'+(season?`?season=${season}`:''));
  const out={};
  const walk=n=>{ (n.standings?.entries||[]).forEach(e=>{ const st={}; (e.stats||[]).forEach(s=>{ st[s.name||s.type]= s.value ?? parseFloat(s.displayValue); });
      out[String(e.team.id)]={w:st.wins||0, l:st.losses||0, pf:st.avgPointsFor, pa:st.avgPointsAgainst}; });
    (n.children||[]).forEach(walk); };
  walk(json); return out;
}
async function loadInjuries(){
  const {json} = await fetchJSON(`${ESPN}/injuries`); const map={};
  (json.injuries||[]).forEach(t=>{
    const list=(t.injuries||[]).map(i=>{ const a=i.athlete||{}; const href=(a.links||[])[0]?.href||'';
      return {pid:String(a.id || (href.match(/id\/(\d+)/)||[])[1] || ''), name:a.displayName||'Unknown', pos:a.position?.abbreviation||'',
        status:i.status||i.type?.description||'', detail:i.shortComment||i.details?.type||''}; });
    if(t.id) map[String(t.id)]=list; if(t.displayName) map['n:'+t.displayName]=list;
  });
  return map;
}
async function loadOdds(force){
  const key=S.set.oddsKey.trim(); if(!key) return null;
  const cache=store.get('oddsCache',null);
  if(!force && cache && cache.key===key.slice(-6) && Date.now()-cache.t < 10*60e3) return cache.data;

// Most legs possible while the whole combo still wins at least your win-rate threshold.
// Legs are added from most to least likely, so this gives the longest combo that clears the bar.
function bestCombo(legs){
  const need=Math.max(.5,S.set.minWinP/100), c=[]; let p=1;
  legs.slice().sort((a,b)=>b.e.p-a.e.p).forEach(x=>{ if(p*x.e.p>=need){ c.push(x); p*=x.e.p; } });

  return {legs:c,p,o,ev,conf,stake:Math.floor(Math.min(bank*f*S.set.kelly,cap)/10)*10};
}

function confChart(e){

  return `<div class="cbar" role="img" aria-label="Confidence ${e.conf} of 100">${seg.map(([n,v,,col])=>`<i style="width:${v}%;background:${col}"></i>`).join('')}</div>
    <div class="leg">${seg.map(([n,v,mx,col])=>`<span><em style="background:${col}"></em>${n}<b>${v.toFixed(0)}/${mx}</b></span>`).join('')}
    ${c.evid?`<span><em style="background:#EAF0FA"></em>Evidence check<b>${c.evid>0?'+':'−'}${Math.abs(Math.round(c.evid))}</b></span>`:''}
    ${c.penalty?`<span style="color:#FFB0B0"><em style="background:var(--bad)"></em>Uncertainty penalty<b>−${c.penalty}</b></span>`:''}
    <span style="font-weight:800">Total<b style="color:var(--amber)">${e.conf} · ${confLabel(e.conf)}</b></span></div>`;
}
function kellyChart(e){
  const k=e.kelly, s=S.set, fr=s.kelly===.5?'½':s.kelly===.25?'¼':s.kelly+'×';
  if(k.f<=0) return `<p class="cap">Kelly's answer is <b>₱0</b>: at odds ${e.odds.toFixed(2)} this bet loses money on average, so there is nothing to size.</p>`;
  const rows=[['Full Kelly',k.full],[`Your ${fr} Kelly`,k.frac],[`${s.maxPct}% bankroll cap`,k.capPct],['Max bet cap',k.maxBet],['Your stake',e.rawStake,1]];
  const mx=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(([n,v,fin])=>`<div class="krow ${fin?'fin':''}"><span>${n}</span><div class="kb"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div><b>${peso(v)}</b></div>`).join('')+
    `<p class="cap">Kelly formula: edge ÷ (odds − 1) = ${pct(e.ev,1)} ÷ ${(e.odds-1).toFixed(2)} = <b>${pct(k.f,1)}</b> of your ${peso(k.bank)} bankroll. You bet ${fr} of that, then take the smallest of that and your two caps, rounded down to ₱10.${e.rawStake<s.minBet?` That's under your ₱${s.minBet} minimum, so it's skipped.`:''}</p>`;
}
function dotsChart(e){
  const wins=Math.round(e.p*100), stake=e.rawStake||100; let s=`<svg class="chart" viewBox="0 0 340 92" role="img" aria-label="${wins} wins out of 100 bets">`;
  for(let i=0;i<100;i++){ const cx=10+(i%20)*16.4, cy=10+Math.floor(i/20)*17.5; s+=`<circle cx="${cx.toFixed(1)}" cy="${cy}" r="6" fill="${i<wins?'#3DDC97':'rgba(255,114,114,.45)'}"/>`; }
  const exp=100*stake*e.ev;
  return s+`</svg><p class="cap">Out of 100 bets like this you'd expect about <b style="color:var(--good)">${wins} wins</b> and <b style="color:var(--bad)">${100-wins} losses</b>. At ${peso(stake)} a bet${e.rawStake?'':' (example amount)'}, each win pays +${peso(stake*(e.odds-1))} and each loss costs −${peso(stake)}, so you'd end up around <b class="${exp>=0?'pos':'neg'}">${exp>=0?'+':'−'}${peso(Math.abs(exp))}</b>. Losing streaks of 4–5 in a row will still happen.</p>`;
}
function explainHtml(s, curveNote){
  const e=s.e, w=S.set.trust;
  const st=(n,t,body,cap)=>`<div class="step"><div class="step-h"><span class="sn">${n}</span><b>${t}</b></div>${body}${cap?`<p class="cap">${cap}</p>`:''}</div>`;

  h+=st(3,'Compare with the sportsbook', probChart(e),
    e.pMkt!=null ? `The market's chance comes from both sides' odds with the bookie's margin removed. Final = ${w}% model + ${100-w}% market. <b>The bet only makes money long-term if Final is right of the red line.</b> Here it is ${e.ev>=0?'right':'left'} of it by ${Math.abs((e.p-1/e.odds)*100).toFixed(1)} points, an edge of ${sgn(e.ev*100,1)}%.`

  return `<div class="steps">${h}</div>`;
}

/* ---------- lineups on the court ---------- */
function getLineup(g, side){
  const t=g[side], key=g.id+':'+t.id;
  return memo('lu|'+key, async()=>{
    S.lineups[key]={loading:true};
    try{
      let list, from;
      if(g.state!=='pre'){ list=(await getBox(g.id))[t.id]; from='this game'; }
      else {
        const pk=await teamPack(t.id), last=pk.games[0]; if(!last) throw new Error('no games yet');
        const ag=agg(pk.games,t.id); list=last.box[t.id].map(p=>({...p, mpgS:ag.find(a=>a.id===p.id)?.mpg||0}));
        from=`their last game ${last.home?'vs':'at'} ${last.opp.abbr} (${new Date(last.date).toLocaleDateString([], {month:'short',day:'numeric'})})`;
      }
      if(!list?.length) throw new Error('no box score');
      const inj=new Map(injList(t).map(i=>[i.pid,i])), isOut=p=>inj.has(p.id)&&statusW(inj.get(p.id).status)>=.75, out=[];
      const bench=list.filter(p=>!p.starter && !isOut(p) && (p.mpgS>0 || !p.dnp)).sort((a,b)=>(b.mpgS||b.min)-(a.mpgS||a.min));
      const five=list.filter(p=>p.starter).slice(0,5).map(p=>{
        if(g.state==='pre' && isOut(p) && bench.length){ const k=bench.findIndex(b=>grp(b.pos)===grp(p.pos)); const rep=bench.splice(k>=0?k:0,1)[0];
          out.push({...p,inj:inj.get(p.id)}); return {...rep, starter:true, replaces:p.name, inj:inj.get(rep.id)||null}; }
        return {...p, inj:inj.get(p.id)||null}; });
      return (S.lineups[key]={slots:slotify(five), out, from});
    }catch(e){ return (S.lineups[key]={error:true}); }
  });
}
function slotify(list){
  const slots={PG:null,SG:null,SF:null,PF:null,C:null};
  const pref=p=>({PG:['PG','SG'],SG:['SG','SF','PG'],G:['PG','SG','SF'],SF:['SF','PF','SG'],PF:['PF','C','SF'],F:['PF','SF','C'],C:['C','PF'],FC:['C','PF'],CF:['C','PF'],GF:['SF','SG'],FG:['SF','SG']})[p.pos.toUpperCase()]||['SF','PF','SG','PG','C'];
  const rank={C:0,FC:0,CF:0,PG:1,SG:2,PF:3,SF:4,G:5,F:6};
  list.slice().sort((a,b)=>(rank[a.pos]??9)-(rank[b.pos]??9)).forEach(p=>{ const s=pref(p).find(x=>!slots[x]) || Object.keys(slots).find(x=>!slots[x]); if(s) slots[s]=p; });
  return slots;
}

function buildEvidence(g){

function coreIds(g,side){ const L=S.lineups[g.id+':'+g[side].id]; const ids=L?.slots?Object.values(L.slots).filter(Boolean).map(p=>p.id):[]; if(ids.length) return ids;

async function legOutcome(l){
  const sn=S.snap[l.gid]; if(!sn?.res || !l.key) return null;
  const mg=sn.res.hs-sn.res.as, tot=sn.res.hs+sn.res.as, cmp=v=>v>0?'won':v<0?'lost':'push';
  switch(l.key){
    case 'mlH': return cmp(mg); case 'mlA': return cmp(-mg);
    case 'spH': return cmp(mg+l.point); case 'spA': return cmp(-mg+l.point);
    case 'ov': return cmp(tot-l.point); case 'un': return cmp(l.point-tot);
    case 'prop': { try{ const box=await getBox(l.gid), pl=Object.values(box).flat().find(p=>p.id===l.prop.pid); if(!pl||pl.dnp) return 'push';
      const v=STATS[l.prop.stat][1](pl); l.prop.act=v; return cmp(l.prop.side==='Over'?v-l.prop.line:l.prop.line-v); }catch(e){ return null; } }

const STATS={pts:['Points',g=>g.pts],reb:['Rebounds',g=>g.reb],ast:['Assists',g=>g.ast],tpm:['3-pointers',g=>g.tpm],pra:['Pts+Reb+Ast',g=>g.pts+g.reb+g.ast],pr:['Pts+Reb',g=>g.pts+g.reb],pa:['Pts+Ast',g=>g.pts+g.ast]};
function propAnalysis(){
  const P=S.props, log=S.logs[P.pid]; if(!log) return null;
  const f=STATS[P.stat][1], games=log.filter(g=>!isNaN(f(g))), vals=games.map(f), n=vals.length; if(!n) return {n:0};
  const season=avg(vals), l10=avg(vals.slice(0,10)), l5=avg(vals.slice(0,5));
  let proj = n>=10 ? .5*season+.3*l10+.2*l5 : n>=5 ? .6*season+.4*l5 : season;
  const sdv=Math.sqrt(vals.reduce((a,v)=>a+(v-season)**2,0)/Math.max(1,n-1));
  const g=S.games.find(x=>x.id===P.gid), opp=g && (g.home.id===P.team ? g.away : g.home), os=opp && S.standings[opp.id];
  let oppF=1; if(os && os.pa>0){ const k=['pts','pra','pr','pa'].includes(P.stat)?1:.5; oppF=1+((os.pa-S.lg)/S.lg)*k; }
  proj*=oppF;

  const minCv=minS? Math.sqrt(avg(mins.map(m=>(m-minS)**2)))/minS : 0;
  const line=parseFloat(P.line), res={n,season,l10,l5,proj,sd,oppF,opp,minS,minL5,minCv,vals,games};
  if(!(line>0)) return res;
  const last10=vals.slice(0,10), hit10=last10.filter(v=>v>line).length/last10.length, hitAll=vals.filter(v=>v>line).length/n;

  const label=(side)=>`${P.pname} ${side} ${line} ${STATS[P.stat][0].toLowerCase()}`;
  const mk=(side,pm,pk,o)=>{ if(!(o>1)) return null; const s={id:`prop:${P.pid}:${P.stat}:${side}`, gid:P.gid, key:'prop', label:label(side), kind:'Player prop',
    odds:o, src:'manual', e:evaluate(pm,pk,o,ctx), game:g?`${g.away.abbr} @ ${g.home.abbr}`:'',
    dist:{mean:proj, sd, t:line, dir:side==='Over'?'gt':'lt', xlabel:`${P.pname}'s ${STATS[P.stat][0].toLowerCase()} in this game`}}; s.prop={pid:P.pid,stat:P.stat,line,side,proj,sd}; S.sel[s.id]=s; return s; };
  return {...res, line, hit10, hitAll, pOver,

}

    return {n, count:bs.length, pred:avg(bs.map(x=>x.p)), act: bs.length ? bs.filter(x=>x.status==='won').length/bs.length : 0}; });
  h+=`<section class="glass panel"><div class="lbl">Is the model honest? Predicted vs actual win rate</div><div class="scroll-x"><table class="tbl"><thead><tr><th>Confidence</th><th class="r">Bets</th><th class="r">Predicted</th><th class="r">Actual</th></tr></thead><tbody>
    ${buckets.map(b=>`<tr><td>${b.n}</td><td class="r mono">${b.count}</td><td class="r mono">${b.count?pct(b.pred):'—'}</td><td class="r mono ${b.count?(b.act>=b.pred-.03?'pos':'neg'):''}">${b.count?pct(b.act):'—'}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted small" style="margin-top:8px">Under about 100 settled bets these numbers are mostly luck. If "Actual" keeps landing well below "Predicted", lower "Trust in model" in Settings.</p></section>`;
  h+=`<section class="glass panel"><div class="lbl">Open bets · ${pend.length}</div>${pend.length?pend.map(betRow).join(''):'<p class="muted small">Nothing open. Use Log on any bet to track it.</p>'}</section>`;
  const hist=settled.slice().sort((a,b)=>(b.settledAt||b.ts)-(a.settledAt||a.ts)).slice(0,40);
  h+=`<section class="glass panel"><div class="lbl">History</div>${hist.length?hist.map(betRow).join(''):'<p class="muted small">Settled bets show up here.</p>'}</section>
  <section class="glass panel"><div class="lbl">Back up your log</div><p class="muted small" style="margin:4px 0 10px">Your bets are saved in this browser only. Copy them somewhere safe now and then, or move them to another device.</p>
    <div class="chips"><button class="btn tap" data-act="export">Copy backup</button><button class="btn ghost tap" data-act="import">Restore from pasted backup</button></div>
    <textarea class="inp" id="io" placeholder="Paste a backup here, then tap Restore" style="margin-top:10px"></textarea></section>`;
  v.innerHTML=h;
}
function betRow(b){
  const res = b.status==='pending' ? '' : b.status==='push' ? 'push' : (profitOf(b)>=0?'+':'−')+peso(Math.abs(profitOf(b)));
  return `<div class="bet-row"><div><b>${esc(b.label)}</b> <span class="mono">@ ${(+b.odds).toFixed(2)}</span><div class="meta">${esc(b.game||'')} · ${new Date(b.ts).toLocaleDateString([], {month:'short',day:'numeric'})} · ${b.stake?peso(b.stake):'paper pick'} · ${pct(b.p)} · conf ${b.conf}</div></div>
    <div class="res ${b.status==='won'?'pos':b.status==='lost'?'neg':'muted'}">${b.status==='pending'?'<span class="pill v-lean">open</span>':res}</div>
    ${b.pm?pmHtml(b):''}
    <div class="acts">${b.status==='pending'?`<button class="btn sm tap" data-act="settle" data-id="${b.id}" data-res="won">Won</button><button class="btn sm tap" data-act="settle" data-id="${b.id}" data-res="lost">Lost</button><button class="btn sm tap" data-act="settle" data-id="${b.id}" data-res="push">Push</button>`:`<button class="btn sm ghost tap" data-act="settle" data-id="${b.id}" data-res="pending">Reopen</button>`}<button class="btn sm ghost danger tap" data-act="del" data-id="${b.id}">${S.delArm===b.id?'Tap again to delete':'Delete'}</button></div></div>`;
}

/* ---------- settings ---------- */
const SLIDERS={
  kelly:{l:'Kelly fraction',min:.1,max:1,step:.05,fmt:v=>v>=.99?'Full':v===.5?'Half (½)':v===.25?'Quarter (¼)':(+v).toFixed(2)+'×',
    p:'How much of the full Kelly stake to bet. Half Kelly keeps about three quarters of the long-run growth with far smaller swings. Full Kelly assumes your win chances are exactly right, and early on they won\'t be.'},
  maxPct:{l:'Max per bet (% of bankroll)',min:1,max:10,step:.5,fmt:v=>v+'%',p:'A second ceiling under your ₱500 cap. With a small bankroll this keeps one bad night from wiping you out.'},
  dailyPct:{l:'Max per day (% of bankroll)',min:5,max:40,step:1,fmt:v=>v+'%',p:'Best bets stop once today\'s stakes reach this amount.'},
  minEdge:{l:'Minimum edge',min:0,max:10,step:.5,fmt:v=>v+'%',p:'Expected profit per ₱100 staked. Below about 2% the estimate is mostly noise.'},
  minConf:{l:'Minimum confidence',min:0,max:90,step:5,fmt:v=>v,p:'Hide bets whose confidence score is lower than this.'},
  minWinP:{l:'Win-rate mode threshold',min:50,max:70,step:1,fmt:v=>v+'%',p:'With win-rate mode on, only bets at least this likely to win are recommended. You\'ll win more often but bet less often, and you\'ll skip most underdogs, even good ones.'},
  trust:{l:'Trust in model vs market',min:0,max:100,step:5,fmt:v=>v+'% model',p:'Final win chance blends the model with the sportsbook\'s own odds (with the bookie\'s margin removed). Markets are sharp; keep this at 50% or below until your tracker shows the model is calibrated.'},
  hca:{l:'Home-court advantage',min:0,max:4,step:.5,fmt:v=>v+' pts',p:'Recent NBA seasons sit around 2 points.'}
};
function renderSettings(){
  const s=S.set, sl=k=>{ const d=SLIDERS[k]; return `<div class="srow"><div class="srow-h"><label for="s-${k}">${d.l}</label><output id="so-${k}">${d.fmt(s[k])}</output></div>
    <input type="range" id="s-${k}" min="${d.min}" max="${d.max}" step="${d.step}" value="${s[k]}" data-inp="set" data-k="${k}"><p>${d.p}</p></div>`; };
  const num=(k,l,p,step=10)=>`<div class="srow"><div class="srow-h"><label for="s-${k}">${l}</label></div><input class="inp" id="s-${k}" type="number" inputmode="decimal" step="${step}" value="${s[k]}" data-chg="set" data-k="${k}"><p>${p}</p></div>`;
  const ex=(()=>{ const o=1.91, p=.56; return stakeFor(p,o); })();
  $('#v-settings').innerHTML=`<div class="sec-h"><div><h2>Settings</h2><p class="muted small">Saved in this browser.</p></div></div>
  <section class="glass set-group"><h3>Bankroll & limits</h3>
    ${num('startBank','Starting bankroll (₱)','Money set aside for betting that you can afford to lose completely. Profits and losses from the tracker are added on top.')}
    ${num('maxBet','Max bet (₱)','Hard cap on any single bet.')}
    ${num('minBet','Minimum bet (₱)','Smallest stake your sportsbook accepts. Smaller Kelly stakes are skipped.',5)}
    ${sl('maxPct')}${sl('dailyPct')}</section>
  <section class="glass set-group"><h3>Bet sizing</h3>${sl('kelly')}
    <p class="muted small">Example with your settings: a bet at odds 1.91 that wins 56% of the time → <b class="mono" style="color:var(--amber)">${ex?peso(ex):'below minimum'}</b>.</p></section>
  <section class="glass set-group"><h3>Filters</h3>${sl('minEdge')}${sl('minConf')}
    <div class="srow"><div class="srow-h"><label for="s-winMode">Win-rate mode</label><span class="switch"><input type="checkbox" id="s-winMode" ${s.winMode?'checked':''} data-chg="set" data-k="winMode"><i></i></span></div>
      <p>Favour bets that win more often. Useful when you'd rather have steady small wins than chase underdog value.</p></div>${sl('minWinP')}
    <div class="srow"><div class="srow-h"><label for="s-combos">Suggest combos</label><span class="switch"><input type="checkbox" id="s-combos" ${s.combos?'checked':''} data-chg="set" data-k="combos"><i></i></span></div>
      <p>Adds as many recommended bets as it can while the whole combo still wins at least your win-rate threshold above. Pays more than singles, staked at half your normal limit.</p></div></section>
  <section class="glass set-group"><h3>Model</h3>
    <div class="srow"><div class="srow-h"><label for="s-autoTune">Learn from results</label><span class="switch"><input type="checkbox" id="s-autoTune" ${s.autoTune?'checked':''} data-chg="set" data-k="autoTune"><i></i></span></div>
      <p>Grades every prediction against the final score and retunes the score correction, typical miss, totals and trust in the model. Starts after 15 finished games.</p></div>
    ${sl('trust')}${sl('hca')}</section>
  <section class="glass set-group"><h3>Live odds</h3>
    <div class="srow"><div class="srow-h"><label for="s-book">Your sportsbook</label></div><input class="inp" id="s-book" type="text" value="${esc(s.book||'')}" data-chg="set" data-k="book" style="font-family:var(--f-body)"><p>Shown on each betslip so you know where to place it.</p></div>
    <div class="srow"><div class="srow-h"><label for="s-oddsKey">The Odds API key</label></div><input class="inp" id="s-oddsKey" type="password" autocomplete="off" placeholder="Paste your free key" value="${esc(s.oddsKey)}" data-chg="set" data-k="oddsKey">
      <p>Optional. Get a free key at <a href="https://the-odds-api.com" target="_blank" rel="noopener">the-odds-api.com</a> (500 credits a month; each refresh uses 3, and results are cached for 10 minutes). Without a key the app uses ESPN's posted line.${S.oddsLeft!=null?` Credits left this month: <b class="mono">${esc(S.oddsLeft)}</b>.`:''}</p></div></section>
  <section class="glass set-group"><h3>How the numbers work</h3><div class="prose">
    <p><b>Projection.</b> Each team's points scored and allowed per game, pulled toward league average while the season is young, plus home court, back-to-backs, injured players and your own read. That gives a projected margin and total.</p>
    <p><b>Win chance.</b> NBA results land about 12.5 points either side of the projected margin (18 for totals). That spread turns a projected margin into a percentage, which is then blended with the market's no-margin probability.</p>
    <p><b>Edge.</b> Win chance × decimal odds − 1. At odds of 1.91 you need 52.4% just to break even.</p>
    <p><b>Confidence (0–99).</b> Combines edge size, win chance, games played, price quality and agreement with the market, minus points for questionable players. It's a ranking aid, not a promise. The tracker shows whether it holds up.</p>
    <p><b>Stake.</b> Kelly fraction × bankroll × edge ÷ (odds − 1), capped by your per-bet % and ₱${s.maxBet} limit, rounded down to ₱10.</p>
    <p>No model beats the sportsbook every night. Bet only money you can lose, take breaks after losing streaks, and if betting stops being fun, the PAGCOR helpline and the National Center for Mental Health crisis line (1553) can help. You must be 21 or older to bet in the Philippines.</p></div>
    <button class="btn danger ghost tap" data-act="reset" style="align-self:flex-start">${S.resetArm?'Tap again to reset settings':'Reset settings to defaults'}</button></section>`;
}

/* ---------- view switching ---------- */
const TABS=['slate','props','tracker','settings'];
function renderView(){ ({slate:renderSlate,props:renderProps,tracker:renderTracker,settings:renderSettings})[S.tab](); }
function renderAll(){ renderHeader(); renderView(); if(S.betSid) renderBet(); if(S.sheetGid) renderSheetDyn(); }
function refreshMain(){ if(S.tab==='slate') renderSlate(); if(S.betSid) renderBet(); }
function switchTab(t){
  const fromBet=!!S.betSid; if(fromBet){ S.betSid=null; $('#v-bet').hidden=true; }
  if(t===S.tab && !fromBet) return; S.tab=t; buzz();
  TABS.forEach(x=>{ $('#v-'+x).hidden = x!==t; });
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  renderView(); window.scrollTo({top:0,behavior:'smooth'});
  try{ sessionStorage.setItem('ce_tab',t); }catch(e){}
}

/* ---------- events ---------- */
const ACT={
  tab:el=>switchTab(el.dataset.tab),
  refresh:()=>{ buzz(); loadAll(true); },
  day:el=>{ S.dayOffset=+el.dataset.day; S.games=[]; buzz(); loadAll(); },
  game:el=>{ buzz(); const xs=S.sel[el.dataset.xsid]; if(xs) S.xkey[xs.gid]=xs.key; openGame(el.dataset.gid);
    if(xs) setTimeout(()=>$('#gm-x')?.scrollIntoView({behavior:'smooth',block:'start'}),380); },
  bet:el=>{ buzz(); openBet(el.dataset.sid); },
  logcombo:()=>{ const c=S.combo; if(!c) return; buzz();
    S.bets.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), day:etYMD(0), gid:'combo', game:c.legs.map(x=>x.game).join(' + '),
      label:'Combo: '+c.legs.map(x=>x.label).join(' + '), kind:'Combo', legs:c.legs.map(x=>({gid:x.gid,key:x.key,point:x.point,odds:x.odds,label:x.label})), odds:+c.o.toFixed(2), stake:c.stake, p:c.p, conf:c.conf, ev:c.ev, status:'pending'});
    saveBets(); renderHeader(); refreshMain(); toast(`Logged combo · ${peso(c.stake)} at ×${c.o.toFixed(2)}`); },
  betsel:el=>{ S.betSid=el.dataset.sid; buzz(); renderBet(); },
  back:()=>{ buzz(); closeBet(); },
  jump:el=>{ document.getElementById(el.dataset.to)?.scrollIntoView({behavior:'smooth',block:'start'}); },
  bbsort:el=>{ S.bbSort=el.dataset.k; buzz(); renderSlate(); },
  player:el=>{ buzz(); const g=S.games.find(x=>x.id===el.dataset.gid); if(g) playerInfo(g,el.dataset.tid,el.dataset.pid);
    document.querySelectorAll('.pc.on').forEach(x=>x.classList.remove('on')); el.classList.add('on'); },
  toprops:el=>{ const tid=el.dataset.tid, pid=el.dataset.pid; closeSheet();
    S.props={...S.props,gid:el.dataset.gid,team:tid,pid,pname:el.dataset.name,line:'',q:''}; switchTab('props'); renderProps();
    getRoster(tid).then(renderProps).catch(()=>{}); getLog(pid).then(renderProps).catch(()=>toast('Game log did not load. Try again.')); },
  close:()=>closeSheet(),
  why:el=>{ const s=S.sel[el.dataset.sid]; if(!s) return; buzz();
    if(s.key==='prop'){ S.props.side=s.id.split(':').pop(); renderProps(); $('#prop-x')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    (S.xkey=S.xkey||{})[s.gid]=s.key; renderSheetDyn(); if(!el.dataset.stay) $('#gm-x')?.scrollIntoView({behavior:'smooth',block:'start'}); },
  log:el=>{ const s=S.sel[el.dataset.sid]; if(!s) return; buzz();
    S.bets.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), day:etYMD(0), gid:s.gid, game:s.game, label:s.label,
      kind:s.kind, odds:s.odds, stake:s.e.stake, p:s.e.p, conf:s.e.conf, ev:s.e.ev, status:'pending', key:s.key, point:s.point, prop:s.prop||null, snap:betSnap(s)});
    saveBets(); renderHeader(); toast(s.e.stake ? `Logged ${s.label} · ${peso(s.e.stake)}` : `Logged ${s.label} as a paper pick (₱0)`); refreshMain(); },
  settle:el=>{ const b=S.bets.find(x=>x.id===el.dataset.id); if(!b) return; b.status=el.dataset.res; b.settledAt=Date.now(); buzz(); saveBets(); renderHeader(); renderTracker(); },
  del:el=>{ if(S.delArm!==el.dataset.id){ S.delArm=el.dataset.id; renderTracker(); return; } S.bets=S.bets.filter(x=>x.id!==el.dataset.id); S.delArm=null; saveBets(); renderHeader(); renderTracker(); toast('Bet deleted'); },
  'clear-odds':el=>{ const o=ovOf(el.dataset.gid); o.odds={}; saveOv(); renderSheetDyn(); refreshMain(); toast('Back to posted prices'); },
  pgame:el=>{ S.props={...S.props,gid:el.dataset.gid,team:null,pid:null,q:''}; buzz(); renderProps(); },
  pteam:el=>{ const tid=el.dataset.tid; S.props={...S.props,team:tid,pid:null,q:''}; buzz(); renderProps();
    getRoster(tid).then(renderProps).catch(()=>{ S.rosters[tid]=[]; toast('Roster did not load. Try again.'); renderProps(); }); },
  pplayer:el=>{ const pid=el.dataset.pid; S.props={...S.props,pid,pname:el.dataset.name,line:''}; buzz(); renderProps();
    getLog(pid).then(renderProps).catch(()=>{ toast('Game log did not load. Try again.'); }); },
  pstat:el=>{ S.props.stat=el.dataset.stat; S.props.line=''; buzz(); renderProps(); },
  export:()=>{ const txt=JSON.stringify({v:1,bets:S.bets,set:{...S.set,oddsKey:''}}); const ta=$('#io'); ta.value=txt;
    navigator.clipboard?.writeText(txt).then(()=>toast('Backup copied'),()=>{ ta.select(); toast('Select the text below and copy it'); }) ?? (ta.select(), toast('Select the text below and copy it')); },
  import:()=>{ try{ const d=JSON.parse($('#io').value); if(!Array.isArray(d.bets)) throw 0; S.bets=d.bets; if(d.set) S.set={...S.set,...d.set,oddsKey:S.set.oddsKey}; saveBets(); saveSet(); renderAll(); toast(`Restored ${d.bets.length} bets`); }
    catch(e){ toast('That text isn\'t a Courtside Edge backup'); } },
  reset:()=>{ if(!S.resetArm){ S.resetArm=true; renderSettings(); return; } S.resetArm=false; S.set={...DEF,oddsKey:S.set.oddsKey}; saveSet(); renderAll(); toast('Settings reset'); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; ACT[el.dataset.act]?.(el,e); });
document.addEventListener('change',e=>{
  const el=e.target, c=el.dataset.chg; if(!c) return;
  if(c==='odds'||c==='point'){ const o=ovOf(el.dataset.gid).odds, k=el.dataset.key, v=el.value.trim();
    if(c==='odds'){ if(v==='' ) delete o[k]; else if(+v>1) o[k]=+v; else { toast('Decimal odds must be above 1.00'); return; } }
    else { const key=k==='spH'?'spPoint':'totPoint'; if(v==='') delete o[key]; else o[key]=+v; }
    saveOv(); renderSheetDyn(); refreshMain(); return; }
  if(c==='inj'){ const ov=ovOf(el.dataset.gid); ov.inj[el.dataset.pid]=el.checked; saveOv(); buzz(); renderSheetDyn(); refreshMain(); return; }
  if(c==='set'){ const k=el.dataset.k; S.set[k] = el.type==='checkbox' ? el.checked : (k==='oddsKey'||k==='book') ? el.value.trim() : (+el.value||0);
    saveSet(); renderHeader(); if(k==='oddsKey'){ toast(el.value?'Key saved. Loading odds…':'Key removed'); loadAll(true); } else renderSettings(); return; }
  if(c==='pline'){ S.props.line=el.value; renderProps(); }
  if(c==='pover'){ S.props.over=el.value; renderProps(); }
  if(c==='punder'){ S.props.under=el.value; renderProps(); }
});
document.addEventListener('input',e=>{
  const el=e.target, c=el.dataset.inp; if(!c) return;
  if(c==='tweak'){ const g=S.games.find(x=>x.id===el.dataset.gid); ovOf(g.id).tweak=+el.value; $('#tw-out').textContent=twLabel(g,el.value); saveOv(); renderSheetDyn(); refreshMain(); }
  if(c==='set'){ const k=el.dataset.k; S.set[k]=+el.value; $('#so-'+k).textContent=SLIDERS[k].fmt(+el.value); saveSet(); renderHeader(); }
  if(c==='psearch'){ S.props.q=el.value; const r=$('#roster'); if(r && S.rosters[S.props.team]) r.innerHTML=rosterHtml(S.rosters[S.props.team]); }
});
document.addEventListener('change',e=>{ if(e.target.dataset.inp==='set') renderSettings(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* touch: ripple, glare, swipe between tabs, drag sheet to dismiss */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointerdown',e=>{ const el=e.target.closest('.tap'); if(!el || reduce) return;
  const r=el.getBoundingClientRect(), d=Math.max(r.width,r.height)*2.2, s=document.createElement('span');
  s.className='rip'; s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s); setTimeout(()=>s.remove(),600); },{passive:true});
document.addEventListener('pointermove',e=>{ const el=e.target.closest('.react'); if(!el) return; const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px'); el.style.setProperty('--my',(e.clientY-r.top)+'px'); },{passive:true});
let sw=null;
$('#views').addEventListener('touchstart',e=>{ if(e.target.closest('input,textarea,.hscroll,.scroll-x,.roster')) { sw=null; return; } const t=e.touches[0]; sw={x:t.clientX,y:t.clientY,t:Date.now()}; },{passive:true});
$('#views').addEventListener('touchend',e=>{ if(!sw) return; const t=e.changedTouches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
  if(S.betSid){ if(dx>70 && Math.abs(dy)<45 && Date.now()-sw.t<600) closeBet(); sw=null; return; }
  if(Math.abs(dx)>70 && Math.abs(dy)<45 && Date.now()-sw.t<600){ const i=TABS.indexOf(S.tab)+(dx<0?1:-1); if(i>=0 && i<TABS.length) switchTab(TABS[i]); } sw=null; },{passive:true});
(()=>{ const grab=$('#grab'), panel=$('#sheet-panel'); let y0=null, dy=0;
  grab.addEventListener('pointerdown',e=>{ y0=e.clientY; dy=0; grab.setPointerCapture(e.pointerId); panel.style.transition='none'; });
  grab.addEventListener('pointermove',e=>{ if(y0==null) return; dy=Math.max(0,e.clientY-y0); panel.style.transform=`translate(-50%,${dy}px)`; });
  const end=()=>{ if(y0==null) return; panel.style.transition='transform .25s ease'; if(dy>110){ panel.style.transform='translate(-50%,100%)'; setTimeout(closeSheet,200); } else panel.style.transform=''; y0=null; };
  grab.addEventListener('pointerup',end); grab.addEventListener('pointercancel',end);
  grab.addEventListener('click',()=>{ if(dy<4) closeSheet(); });
})();

/* ---------- boot ---------- */
try{ const t=sessionStorage.getItem('ce_tab'); if(t && TABS.includes(t)) { S.tab='slate'; switchTab(t); } }catch(e){}
computeTune(); applyTune();
renderHeader(); loadAll();
})();
</script>

</body></html>
